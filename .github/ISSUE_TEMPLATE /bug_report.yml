name: Bug report 🐛
description: Errors or flaws in the code that are leading to incorrect or unexpected behavior.
labels: [Bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report!
    - type: input
      id: php-version
      attributes:
          label: PHP Version
      validations:
          required: true
    - type: input
      id: shopware-version
      attributes:
          label: Shopware Version
      validations:
          required: true
    - type: textarea
      id: actual-behaviour
      attributes:
        label: Actual behavior
        description: Please describe the issue
      validations:
        required: true
    - type: textarea
      id: expected-behaviour
      attributes:
          label: Expected behavior
          description: What did you expect to happen?
      validations:
          required: true
    - type: textarea
      id: steps-to-reproduce
      attributes:
          label: How to reproduce
          description: Tell us how the bug can be reproduced
      validations:
          required: true
